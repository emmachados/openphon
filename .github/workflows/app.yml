name: Application

on:
  push:
    paths: ["app/**", "core/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "core/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get --enforce-lockfile
      - name: Compile the production package without private signing material
        run: flutter build apk --release --no-pub
        env:
          OPENPHON_UNSIGNED_RELEASE: "1"
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-pub
      - name: Start an available iOS simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          devices = json.loads((Path(os.environ["RUNNER_TEMP"]) / "simulators.json").read_text())
          candidates = [d for runtime, group in devices["devices"].items()
                        if ".iOS-" in runtime for d in group if d["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No available iOS simulator runtime")
          print("SIMULATOR_ID=" + candidates[0]["udid"])
          PY
      - run: xcrun simctl boot "$SIMULATOR_ID"
      - run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      - run: flutter test integration_test --no-pub -d "$SIMULATOR_ID"
      - name: Compile the production iOS application
        run: flutter build ios --release --no-codesign --no-pub
