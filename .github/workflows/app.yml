name: Application

on:
  push:
    paths: ["app/**", "core/**", ".github/workflows/app.yml"]
  pull_request:
    paths: ["app/**", "core/**", ".github/workflows/app.yml"]
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get --enforce-lockfile
      - name: Compile the production package without private signing material
        # Flutter 3.47 skips regenerating the Android plugin registrant with
        # --no-pub, leaving test-only plugins from the preceding pub get.
        run: flutter build apk --release
        env:
          OPENPHON_UNSIGNED_RELEASE: "1"
      - run: git diff --exit-code -- pubspec.lock
      - uses: actions/upload-artifact@v4
        with:
          name: android-unsigned-release-apk
          path: app/build/app/outputs/flutter-apk/app-release.apk

  ios:
    runs-on: macos-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true
      - uses: dtolnay/rust-toolchain@stable
      - run: flutter pub get --enforce-lockfile
      - run: flutter build ios --simulator --debug --no-pub
      - name: Start an available iOS simulator
        run: |
          xcrun simctl list devices available -j > "$RUNNER_TEMP/simulators.json"
          python3 - <<'PY' >> "$GITHUB_ENV"
          import json, os
          from pathlib import Path
          devices = json.loads((Path(os.environ["RUNNER_TEMP"]) / "simulators.json").read_text())
          candidates = [d for runtime, group in devices["devices"].items()
                        if ".iOS-" in runtime for d in group if d["name"].startswith("iPhone")]
          if not candidates:
              raise SystemExit("No available iOS simulator runtime")
          print("SIMULATOR_ID=" + candidates[0]["udid"])
          PY
      - run: xcrun simctl boot "$SIMULATOR_ID"
      - run: xcrun simctl bootstatus "$SIMULATOR_ID" -b
      # One file per invocation, each bounded. The combined invocation has
      # stalled after an Xcode build with no test output (29 and 30 September,
      # on different files); a stalled file is retried once, and the
      # simulator log is kept for diagnosis.
      - name: Native integration tests
        run: |
          status=0
          for test in integration_test/*_test.dart; do
            for attempt in 1 2; do
              echo "::group::$test (attempt $attempt)"
              set +e
              perl -e 'alarm shift; exec @ARGV' 900 \
                flutter test "$test" --no-pub -d "$SIMULATOR_ID"
              code=$?
              set -e
              echo "::endgroup::"
              if [ "$code" -eq 0 ]; then break; fi
              # 142 = killed by the alarm (SIGALRM); retry only a stall.
              if [ "$code" -ne 142 ] || [ "$attempt" -eq 2 ]; then
                echo "::error::$test failed with exit code $code"
                status=1
                break
              fi
              echo "::warning::$test stalled for 15 minutes; retrying"
            done
          done
          exit $status
      - name: Keep the simulator log
        if: failure()
        run: |
          xcrun simctl spawn "$SIMULATOR_ID" log show --last 90m --style compact \
            --predicate 'process == "Runner"' > "$RUNNER_TEMP/simulator.log" || true
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: ios-simulator-log
          path: ${{ runner.temp }}/simulator.log
      - name: Compile the production iOS application
        run: flutter build ios --release --no-codesign --no-pub
